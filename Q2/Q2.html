<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Question 2 - Babylon.js WebXR</title>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
    </style>
</head>

<body>

<canvas id="renderCanvas"></canvas>

<script>
const canvas = document.getElementById("renderCanvas");

const engine = new BABYLON.Engine(
    canvas,
    true
);

const createScene = async function () {

    const scene = new BABYLON.Scene(engine);

    const camera = new BABYLON.FreeCamera(
        "camera",
        new BABYLON.Vector3(0, 5, -10),
        scene
    );

    camera.setTarget(BABYLON.Vector3.Zero());
    camera.attachControl(canvas, true);

    const light = new BABYLON.HemisphericLight(
        "light",
        new BABYLON.Vector3(0, 1, 0),
        scene
    );

    light.intensity = 0.7;

    const ground = BABYLON.MeshBuilder.CreateGround(
        "ground",
        {
            width: 10,
            height: 10
        },
        scene
    );

    // Part a
    const MODEL_URL = "./model/";
    const MODEL_FILE = "scene.gltf";
    const MODEL_SCALE = 200;

    const xr = await scene.createDefaultXRExperienceAsync({
        floorMeshes: [ground]
    });

    let currentModel = null;

    let initialPosition = null;
    let initialRotation = null;
    let initialScaling = null;

    xr.input.onControllerAddedObservable.add((controller) => {

        controller.onMotionControllerInitObservable.add(
            (motionController) => {

                if (motionController.handedness === "right") {

                    const trigger =
                        motionController.getComponent(
                            "xr-standard-trigger"
                        );

                    const thumbstick =
                        motionController.getComponent(
                            "xr-standard-thumbstick"
                        );

                    const aButton =
                        motionController.getComponent(
                            "a-button"
                        );

                    const bButton =
                        motionController.getComponent(
                            "b-button"
                        );

                    // Part b
                    if (trigger) {

                        trigger.onButtonStateChangedObservable.add(
                            async () => {

                                if (
                                    trigger.changes.pressed &&
                                    trigger.pressed
                                ) {

                                    const ray = new BABYLON.Ray(
                                        BABYLON.Vector3.Zero(),
                                        BABYLON.Vector3.Forward()
                                    );

                                    controller.getWorldPointerRayToRef(
                                        ray
                                    );

                                    const hit = scene.pickWithRay(
                                        ray,
                                        (mesh) => mesh === ground
                                    );

                                    if (
                                        hit.hit &&
                                        hit.pickedPoint
                                    ) {

                                        const result =
                                            await BABYLON.SceneLoader
                                                .ImportMeshAsync(
                                                    "",
                                                    MODEL_URL,
                                                    MODEL_FILE,
                                                    scene
                                                );

                                        const model =
                                            result.meshes[0];

                                        model.position.copyFrom(
                                            hit.pickedPoint
                                        );

                                        model.scaling.set(
                                            MODEL_SCALE,
                                            MODEL_SCALE,
                                            MODEL_SCALE
                                        );

                                        currentModel = model;

                                        initialPosition =
                                            model.position.clone();

                                        initialRotation =
                                            model.rotation.clone();

                                        initialScaling =
                                            model.scaling.clone();
                                    }
                                }
                            }
                        );
                    }

                    // Part c
                    if (thumbstick) {

                        thumbstick.onAxisValueChangedObservable.add(
                            (axes) => {

                                if (!currentModel) {
                                    return;
                                }

                                currentModel.position.x +=
                                    axes.x * 0.05;

                                currentModel.position.z +=
                                    axes.y * 0.05;
                            }
                        );
                    }

                    // Part e
                    if (aButton) {

                        aButton.onButtonStateChangedObservable.add(
                            () => {

                                if (!currentModel) {
                                    return;
                                }

                                if (
                                    aButton.changes.pressed &&
                                    aButton.pressed
                                ) {

                                    currentModel.scaling
                                        .scaleInPlace(1.1);
                                }
                            }
                        );
                    }

                    if (bButton) {

                        bButton.onButtonStateChangedObservable.add(
                            () => {

                                if (!currentModel) {
                                    return;
                                }

                                if (
                                    bButton.changes.pressed &&
                                    bButton.pressed
                                ) {

                                    currentModel.scaling
                                        .scaleInPlace(0.9);
                                }
                            }
                        );
                    }
                }

                if (motionController.handedness === "left") {

                    const thumbstick =
                        motionController.getComponent(
                            "xr-standard-thumbstick"
                        );

                    const xButton =
                        motionController.getComponent(
                            "x-button"
                        );

                    // Part d
                    if (thumbstick) {

                        thumbstick.onAxisValueChangedObservable.add(
                            (axes) => {

                                if (!currentModel) {
                                    return;
                                }

                                currentModel.rotation.y +=
                                    axes.x * 0.05;
                            }
                        );
                    }

                    // Part f
                    if (xButton) {

                        xButton.onButtonStateChangedObservable.add(
                            () => {

                                if (!currentModel) {
                                    return;
                                }

                                if (
                                    xButton.changes.pressed &&
                                    xButton.pressed
                                ) {

                                    currentModel.position.copyFrom(
                                        initialPosition
                                    );

                                    currentModel.rotation.copyFrom(
                                        initialRotation
                                    );

                                    currentModel.scaling.copyFrom(
                                        initialScaling
                                    );
                                }
                            }
                        );
                    }
                }
            }
        );
    });

    return scene;
};

createScene().then((scene) => {

    engine.runRenderLoop(() => {
        scene.render();
    });

});

window.addEventListener("resize", () => {
    engine.resize();
});
</script>

</body>
</html>
